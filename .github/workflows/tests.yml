name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liricopackage:
    # Package.swift needs swift-tools 6.2, which first ships with Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      # Fails instead of re-resolving when Package.resolved is stale, so tests
      # always build against the committed pins.
      - run: swift test --force-resolved-versions
        working-directory: LiricoPackage
